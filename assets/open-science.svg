<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="315" viewBox="0 0 1200 315" role="img" aria-labelledby="title desc"><title id="title">Open science as a working principle</title><desc id="desc">A network suggests research that can be examined, reproduced and extended.</desc><rect width="1200" height="315" fill="#f7f8f8"/><text x="55" y="55" fill="#496a86" font-size="14" letter-spacing="2">OPEN SCIENCE  /  A WORKING PRINCIPLE</text><text x="55" y="142" fill="#152c49" font-size="31" font-family="Georgia, serif">Knowledge grows when its foundations</text><text x="55" y="187" fill="#152c49" font-size="31" font-family="Georgia, serif">remain open to examination.</text><line x1="56" y1="220" x2="680" y2="220" stroke="#b3c6d3" stroke-width="1"/><text x="56" y="258" fill="#496a86" font-size="13" letter-spacing="1.2">QUESTION  →  EXAMINE  →  REPRODUCE  →  EXTEND</text><circle cx="820" cy="100" r="10" fill="#f4f7f8" stroke="#386d9c" stroke-width="2"/><circle cx="940" cy="155" r="10" fill="#f4f7f8" stroke="#386d9c" stroke-width="2"/><circle cx="1060" cy="82" r="10" fill="#f4f7f8" stroke="#386d9c" stroke-width="2"/><circle cx="1010" cy="260" r="10" fill="#f4f7f8" stroke="#386d9c" stroke-width="2"/><circle cx="850" cy="260" r="10" fill="#f4f7f8" stroke="#386d9c" stroke-width="2"/><line x1="830" y1="104" x2="930" y2="151" stroke="#86a6bd" stroke-width="1.5"/><line x1="950" y1="150" x2="1050" y2="87" stroke="#86a6bd" stroke-width="1.5"/><line x1="946" y1="164" x2="1005" y2="250" stroke="#86a6bd" stroke-width="1.5"/><line x1="930" y1="161" x2="860" y2="253" stroke="#86a6bd" stroke-width="1.5"/><line x1="860" y1="260" x2="1000" y2="260" stroke="#86a6bd" stroke-width="1.5"/></svg>