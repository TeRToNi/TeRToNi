<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title desc"><title id="title">Fourier–wavelet operator concept</title><desc id="desc">Input field branches into Fourier and wavelet representations. Coarse and fine features exchange information before producing an output field.</desc><rect width="1200" height="455" fill="#f7f8f8"/><text x="52" y="48" fill="#496a86" font-size="14" letter-spacing="2">01  /  REPRESENTATION AND COUPLING</text><text x="52" y="78" fill="#61778a" font-size="15" >Conceptual illustration · not an implementation diagram</text><rect x="45" y="185" width="165" height="110" rx="4" fill="#ffffff" stroke="#becdd7"/><text x="63" y="217" fill="#152c49" font-size="19" >Input field</text><text x="63" y="242" fill="#61778a" font-size="14" >function  u(x)</text><rect x="305" y="115" width="245" height="95" rx="4" fill="#ffffff" stroke="#becdd7"/><text x="323" y="147" fill="#152c49" font-size="19" >Fourier representation</text><text x="323" y="172" fill="#61778a" font-size="14" >global / coarse-scale features</text><rect x="305" y="270" width="245" height="95" rx="4" fill="#ffffff" stroke="#becdd7"/><text x="323" y="302" fill="#152c49" font-size="19" >Wavelet representation</text><text x="323" y="327" fill="#61778a" font-size="14" >localized / fine-scale features</text><rect x="665" y="185" width="190" height="110" rx="4" fill="#ffffff" stroke="#becdd7"/><text x="683" y="217" fill="#152c49" font-size="19" >Coupling</text><text x="683" y="242" fill="#61778a" font-size="14" >information exchange</text><rect x="960" y="185" width="195" height="110" rx="4" fill="#ffffff" stroke="#becdd7"/><text x="978" y="217" fill="#152c49" font-size="19" >Output field</text><text x="978" y="242" fill="#61778a" font-size="14" >learned operator  G(u)</text><line x1="210" y1="220" x2="305" y2="162" stroke="#6486a1" stroke-width="1.5"/><path d="M 298,158 L 305,162 L 298,166" fill="none" stroke="#6486a1" stroke-width="1.5"/><line x1="210" y1="260" x2="305" y2="317" stroke="#6486a1" stroke-width="1.5"/><path d="M 298,313 L 305,317 L 298,321" fill="none" stroke="#6486a1" stroke-width="1.5"/><line x1="550" y1="162" x2="665" y2="215" stroke="#6486a1" stroke-width="1.5"/><path d="M 658,211 L 665,215 L 658,219" fill="none" stroke="#6486a1" stroke-width="1.5"/><line x1="550" y1="317" x2="665" y2="265" stroke="#6486a1" stroke-width="1.5"/><path d="M 658,261 L 665,265 L 658,269" fill="none" stroke="#6486a1" stroke-width="1.5"/><line x1="855" y1="240" x2="960" y2="240" stroke="#6486a1" stroke-width="1.5"/><path d="M 953,236 L 960,240 L 953,244" fill="none" stroke="#6486a1" stroke-width="1.5"/><text x="52" y="422" fill="#496a86" font-size="17" font-family="Georgia, serif" font-style="italic">Global structure and local detail inform one another.</text></svg>